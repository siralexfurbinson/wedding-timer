<html lang="de">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: white;
            background: #000;
        }

        /* Hintergrund-Slideshow */
        .slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: #000;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        /* FIX FÜR IPHONE: Auf kleinen Bildschirmen gesamtes Bild zeigen */
        @media (max-width: 768px) {
            .slide {
                background-size: contain; /* Zeigt das ganze Bild, nicht beschnitten */
                background-color: #000;   /* Schwarze Balken an den Seiten */
            }
        }

        /* Dunkles Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.3) 100%);
            z-index: -1;
        }

        /* Text-Container unten links */
        .content {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 1;
            text-align: left;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-family: 'Tangerine', cursive;
            font-size: 2.5rem;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1;
        }

        .since-text {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 5px;
            opacity: 0.9;
            display: inline;
        }

        .minutes-container {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
        }

        .minutes-number {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .minutes-label {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .wedding-info {
            margin-top: 8px;
            font-size: 0.75rem;
            opacity: 0.7;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .content {
                bottom: 20px;
                left: 20px;
                padding: 10px 15px;
            }
            h1 { font-size: 2rem; }
            .minutes-number { font-size: 1.5rem; }
            .since-text, .minutes-label { font-size: 0.8rem; }
            .wedding-info { font-size: 0.65rem; }
        }
    </style>
</head>

    <!-- Text klein in der Ecke unten links -->
    <div class="content">
        <h1>Glücklich Verheiratet</h1>
        <div>
            <span class="since-text">seit</span>
            <div class="minutes-container">
                <span class="minutes-number" id="minutes">0</span>
                <span class="minutes-label">Minuten</span>
            </div>
        </div>
        <div class="wedding-info">07. März 2026, 14:13 Uhr</div>
    </div>

    <script>
        const WEDDING_DATE = new Date(2026, 2, 7, 14, 13, 0);
        
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const SLIDE_DURATION = 8000;

        function updateMinutes() {
            const now = new Date();
            const difference = now - WEDDING_DATE;
            const minutes = Math.floor(difference / (1000 * 60));
            document.getElementById('minutes').textContent = minutes.toLocaleString('de-DE');
        }

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        window.addEventListener('load', () => {
            updateMinutes();
            setInterval(updateMinutes, 60000);
            setInterval(nextSlide, SLIDE_DURATION);
        });
    </script>
